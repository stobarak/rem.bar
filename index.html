<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>СТО Барак — Зварювальні роботи та обслуговування авто</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --black: #11100f;
      --black-soft: #191715;
      --red: #c94b32;
      --red-dark: #a93b27;
      --cream: #eee1ca;
      --cream-soft: #d9ccb6;
      --border: #e5d8c2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--cream);
      font-family: "Barlow Condensed", Arial, sans-serif;
    }

    .sto-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      padding: 30px 20px 35px;
      display: flex;
      justify-content: center;

      background:
        radial-gradient(circle at 50% 15%,
          rgba(201, 75, 50, 0.08),
          transparent 30%),
        linear-gradient(135deg,
          #11100f 0%,
          #171513 50%,
          #0e0d0c 100%);
    }

    /*
      Decorative diagonal stripes
    */


    .sto-page::before,
    .sto-page::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 18px;
      background: var(--red);
      transform: rotate(-45deg);
      opacity: 0.9;
    }

    .sto-page::before {
      top: 28px;
      left: -95px;
      box-shadow:
        28px 28px 0 var(--red),
        6px 56px 0 var(--red);
    }

    .sto-page::after {
      right: -55px;
      bottom: 35px;
      box-shadow:
        28px 28px 0 var(--red),
        56px 56px 0 var(--red);
    }

    .sto-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    /*
      LOGO
    */

    .sto-logo {
      margin: 5px auto 18px;
      /*border: 7px solid var(--cream);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center; */
    }

    .sto-logo img {
      width: 130px;
      height: 130px;

    }

    /*
      TITLE
    */

    .sto-title {
      margin: 0;
      font-size: clamp(54px, 15vw, 88px);
      line-height: 0.8;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--red);
      text-transform: uppercase;
      margin-top: 150px;
    }

    .sto-title span {
      display: block;
      color: var(--cream);
      font-size: 0.62em;
      margin-bottom: 8px;
    }

    .sto-line {
      width: 85%;
      height: 4px;
      background: var(--red);
      margin: 20px auto 18px;
    }

    .sto-subtitle {
      margin: 0 0 30px;
      color: var(--cream);
      font-size: 21px;
      line-height: 1.15;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /*
      BUTTONS
    */

    .sto-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .sto-button {
      min-height: 76px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 18px;

      padding: 12px 22px;

      border: 2px solid var(--border);
      border-radius: 8px;

      color: var(--cream);
      text-decoration: none;

      background: rgba(20, 18, 16, 0.85);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .sto-button:hover {
      transform: translateY(-2px);
      border-color: var(--red);
      background: rgba(201, 75, 50, 0.12);
    }

    .sto-button:active {
      transform: scale(0.98);
    }

    .sto-button--phone {
      background: var(--red);
      border-color: var(--red);
      color: var(--cream);
    }

    .sto-button--phone:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
    }

    .sto-icon {
      width: 42px;
      min-width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    .sto-button-text {
      text-align: left;
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .sto-button-title {
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sto-button-value {
      margin-top: 5px;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    /*
      LOCATION
    */

    .sto-location {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;

      margin-top: 28px;

      color: var(--cream-soft);
      font-size: 19px;
      font-weight: 600;
    }

    .sto-location-icon {
      color: var(--red);
      font-size: 27px;
    }

    /*
      FOOTER
    */

    .sto-footer {
      margin-top: 18px;
      font-size: 13px;
      color: rgba(238, 225, 202, 0.45);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /*
      MOBILE
    */

    @media (max-width: 480px) {

      .sto-page {
        padding: 28px 18px 30px;
      }

      /* 
      .sto-logo {
        width: 105px;
        height: 105px;
        border-width: 6px;
      }

      .sto-logo::before {
        font-size: 48px;
      } */

      .sto-title {
        font-size: 64px;
      }

      .sto-subtitle {
        font-size: 18px;
        margin-bottom: 24px;
      }

      .sto-button {
        min-height: 70px;
        padding: 10px 17px;
        gap: 13px;
      }

      .sto-icon {
        width: 38px;
        min-width: 38px;
        font-size: 27px;
      }

      .sto-button-title {
        font-size: 19px;
      }

      .sto-button-value {
        font-size: 17px;
      }

      .sto-location {
        font-size: 17px;
      }
    }
  </style>
</head>

</body>
